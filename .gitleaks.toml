# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "ej2-blazor-samples gitleaks config"

# Global allowlist to skip known noisy paths. The component-samples
# directory contains minified third-party CSS theme files that
# regularly trigger false positives (e.g. token-shaped strings in
# bundled stylesheets).
[allowlist]
  paths = [
    '''Common/wwwroot/styles/component-samples/''',
  ]
  description = "Minified third-party CSS assets - not source code"